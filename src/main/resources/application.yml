server:
  port: 9501
spring:
  application:
    name: mcp-site-management-server
  ai:
    mcp:
      server:
        version: 2.0.1
        name: mcp-site-management-server
        type: ASYNC
        protocol: STREAMABLE
        request-timeout: 60s
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp-site-management-server
