server:
  port: 9501

database:
  default-hikari-properties:
    minimum-idle: 1
    maximum-pool-size: 2
    connection-timeout: 5000
    idle-timeout: 15000
    max-lifetime: 60000
    leak-detection-threshold: 2000
  postgres:
    site:
      schema: site
      package-names:
        datasource: siteDatasource
        namedParameterJdbcTemplate: siteNamedParameterJdbcTemplate
        containerEntityManagerFactory: siteContainerEntityManagerFactory
        platformTransactionManager: sitePlatformTransactionManager
        entity: com.karur.mcp_site_management_server.entity
        repository: com.karur.mcp_site_management_server.repository
      # --- UPDATED LINE BELOW ---
      jdbc-url: jdbc:postgresql://localhost:9001/postgres
      username: site_admin
      password: Gunitha@2906
      driver-class-name: org.postgresql.Driver
      hikari:
        schema: site
        connection-test-query: SELECT 1
      jpa:
        show-sql : true
        properties:
          hibernate:
            ddl-auto: update
            dialect: org.hibernate.dialect.PostgreSQLDialect
            format_sql: true

spring:
  application:
    name: mcp-site-management-server
  ai:
    mcp:
      server:
        version: 2.0.1
        name: mcp-site-management-server
        type: ASYNC
        protocol: STREAMABLE
        request-timeout: 60s
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp-site-management-server
