services:
  # --- Your Database Service ---
  postgres:
    image: postgres:latest
    container_name: mcp-site-management-server-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # FORCE IT TO USE THE OLD PATH FORMAT
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-p", "5000"]
    ports:
      - "5001:5000"
    volumes:
      - /home/gunitha/Desktop/mcp/mcp-site-management-server/database/postgres/asset:/var/lib/postgresql/data
    networks:
      - mcp-site-management-server

  # --- Your Java Application Service ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-site-management-server-app
    ports:
      - "9501:9501"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5000/asset
    networks:
      - mcp-site-management-server

networks:
  mcp-site-management-server:
    driver: bridge
