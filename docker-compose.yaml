services:
  # --- Your Database Service ---
  postgres:
    image: postgres:latest
    container_name: mcp-site-management-server-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asset  # 👈 CRITICAL FIX: Tells postgres to create the "asset" database
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-p", "5000"]
    ports:
      - "5001:5000"
    volumes:
      - /home/gunitha/Desktop/mcp/mcp-site-management-server/database/postgres/asset:/var/lib/postgresql/data
    networks:
      - mcp-site-management-server

  # --- Your Java Application Service ---
  app:
    image: mcp-site-management-server-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-site-management-server-app
    ports:
      - "9501:9501"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5000/asset
      SPRING_DATASOURCE_USERNAME: postgres # 👈 Optional but recommended to explicitly map
      SPRING_DATASOURCE_PASSWORD: postgres # 👈 Optional but recommended to explicitly map
    networks:
      - mcp-site-management-server

networks:
  mcp-site-management-server:
    driver: bridge