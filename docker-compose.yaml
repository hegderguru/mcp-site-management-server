services:
  # --- Your Database Service ---
  postgres:
    image: postgres:latest
    container_name: mcp-site-management-server-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asset  # 👈 CRITICAL FIX: Tells postgres to create the "asset" database
      PGDATA: /var/lib/postgresql/data
    command: ["postgres", "-p", "5000"]
    ports:
      - "5001:5000"
    volumes:
      - /home/gunitha/Desktop/mcp/mcp-site-management-server/database/postgres/asset:/var/lib/postgresql/data